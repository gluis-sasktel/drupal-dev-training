helloworld.hello:
  path: '/hello'
  defaults:
    _title: 'Hello World'
    _controller: '\Drupal\helloworld\Controller\HelloworldController::hello'
  requirements:
    _permission: 'access content'

helloworld.hello_person:
  path: '/hello/{name}'
  defaults:
    _title: 'Hello World w/DynamicName'
    _controller: '\Drupal\helloworld\Controller\HelloworldController::hello'
  requirements:
    _permission: 'access content'

helloworld.hello_person_node:
  path: '/hello/{name}/{node_id}'
  defaults:
    _title: 'Hello World Node'
    _controller: '\Drupal\helloworld\Controller\HelloworldController::helloNameNode'
  requirements:
    _permission: 'access content'
